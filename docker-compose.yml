services:
  # ---------------------------------------------------------------------
  # HashiCorp Vault — stockage centralisé des secrets (mode "dev")
  # ---------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: vault-dev
    cap_add:
      - IPC_LOCK   # Autorise Vault à verrouiller ses pages mémoire (empêche
                   # que les secrets en RAM soient écrits sur le disque / swap)
    environment:
      # Token "root" fixe : en mode dev il n'y a pas de vrai unseal (déverrouillage),
      # ce token sert directement à s'authentifier. A NE JAMAIS faire en production.
      VAULT_DEV_ROOT_TOKEN_ID: "dev-only-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"   # exposé sur l'hôte pour pouvoir inspecter Vault (UI/CLI) en démo
    networks:
      - infra-network

  # ---------------------------------------------------------------------
  # Vault-init — dépose le secret de démo dans Vault (dev mode = base vide
  # à chaque démarrage, il faut donc l'alimenter nous-mêmes une fois prêt)
  # ---------------------------------------------------------------------
  vault-init:
    image: hashicorp/vault:1.17
    container_name: vault-init
    depends_on:
      - vault
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dev-only-root-token"
    entrypoint: ["sh", "-c"]
    # Avant : un simple "sleep 3" -- trop fragile en pratique (Docker Desktop
    # sous forte charge, 6 conteneurs qui démarrent en même temps, premier
    # téléchargement des images...). Si Vault n'était pas encore prêt après
    # 3 secondes, ce conteneur échouait SANS relancer, laissant le secret
    # "database" absent de Vault -- ce qui fait planter l'API juste après
    # (elle ne trouve pas la chaîne de connexion au démarrage). On remplace
    # ça par une vraie boucle d'attente active (jusqu'à 60s), qui interroge
    # Vault jusqu'à ce qu'il réponde.
    command: >
      "i=0;
       while [ $$i -lt 30 ]; do
         if vault status >/dev/null 2>&1; then
           echo 'Vault est pret.';
           break;
         fi;
         i=$$((i+1));
         echo 'Vault pas encore pret, nouvel essai dans 2s...';
         sleep 2;
       done;
       vault kv put secret/database ConnectionString='Host=postgres;Port=5432;Database=infra_demo;Username=infra_user;Password=infra_password_dev' &&
       echo 'Secret depose dans Vault (database).'"
    # NOTE : "$$" (et non "$") -- Docker Compose interpole lui-même les "$var"
    # présents dans ce fichier AVANT de démarrer le conteneur. "$$" est
    # l'échappement standard Compose pour dire "laisse ce $ tel quel, c'est
    # pour le shell du conteneur, pas pour toi". Avec un simple "$", Compose
    # remplaçait $i par une chaîne vide et cassait toute la boucle.
    networks:
      - infra-network
    restart: "no"   # tâche ponctuelle : elle s'exécute une fois puis s'arrête, ce n'est pas un service

  # ---------------------------------------------------------------------
  # PostgreSQL — base de données relationnelle pour l'API C# (profils)
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: infra_user
      POSTGRES_PASSWORD: infra_password_dev   # démo uniquement — la vraie chaîne
                                               # de connexion transite par Vault,
                                               # pas par ces variables d'env côté API
      POSTGRES_DB: infra_demo
    ports:
      - "5432:5432"   # publié pour que TOI (depuis ton terminal) puisses lancer
                       # `dotnet ef database update` sans passer par Docker
    volumes:
      - postgres-data:/var/lib/postgresql/data   # persistance des données entre redémarrages
    networks:
      - infra-network

  # ---------------------------------------------------------------------
  # Keycloak — IAM : authentification SSO / OAuth2 / OIDC
  # ---------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # --- Fixe l'URL "officielle" de Keycloak : TOUS les liens qu'il génère
      # (page de connexion, redirections, et le champ "issuer" des jetons)
      # utiliseront "http://localhost:8000", quelle que soit l'adresse
      # réellement utilisée pour l'atteindre. On choisit "localhost:8000" --
      # l'adresse de Kong -- car c'est la seule que le NAVIGATEUR sait
      # résoudre sans configuration supplémentaire sur la machine. Kong
      # route ensuite en interne vers Keycloak (voir kong/kong.yml, services
      # "keycloak-realms" / "keycloak-resources").
      # Côté API (dans le réseau Docker), ceci crée un nouveau problème
      # symétrique : elle ne peut pas non plus résoudre "localhost:8000"
      # (qui, depuis un conteneur, désigne le conteneur lui-même). C'est
      # géré côté C# par KeycloakInternalRoutingHandler (voir
      # Extensions/KeycloakAuthenticationExtensions.cs) : l'API continue de
      # parler à Keycloak directement via "keycloak:8080" en interne, tout
      # en sachant que les jetons contiennent "localhost:8000".
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8000"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Réalm pré-configuré (client + utilisateur de test), importé automatiquement
      # au démarrage grâce à --import-realm : pas besoin de tout recréer à la main
      # à chaque `docker compose down`.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - infra-network

  # ---------------------------------------------------------------------
  # API ASP.NET Core — domaine métier Projets / Tâches / Commentaires
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile   # créé à l'étape 4
    container_name: infra-api
    depends_on:
      vault:
        condition: service_started
      # "service_completed_successfully" (et non une simple liste) : Compose
      # attend que le conteneur vault-init se termine avec le code 0 avant
      # de démarrer l'API -- pas juste qu'il ait "démarré". C'est ce qui
      # manquait : avant, l'API pouvait démarrer alors que vault-init était
      # encore en train d'attendre Vault, voire avait déjà échoué.
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      # Convention ASP.NET Core : "__" (double underscore) = niveau imbriqué
      # dans la config, équivalent à { "Vault": { "Address": "...", "Token": "..." } }
      Vault__Address: "http://vault:8200"
      Vault__Token: "dev-only-root-token"
      # Deux adresses distinctes pour Keycloak (voir la note sur KC_HOSTNAME
      # ci-dessus) : celle que l'API utilise RÉELLEMENT sur le réseau (interne,
      # toujours joignable) et celle qui apparaît DANS les jetons (publique,
      # via Kong) et que l'API doit donc accepter comme "issuer" valide.
      Keycloak__InternalAuthority: "http://keycloak:8080/realms/infra-demo"
      Keycloak__PublicIssuer: "http://localhost:8000/realms/infra-demo"
      # Doit correspondre au "clientId" du realm-export.json ET au claim
      # "aud" (audience) que Keycloak place dans les jetons grâce au mapper
      # "audience-infra-api" -- voir Extensions/KeycloakAuthenticationExtensions.cs.
      Keycloak__ClientId: "infra-api"
    networks:
      - infra-network
    ports:
      # Republié sur un port DIFFÉRENT de Keycloak (qui occupe déjà 8080 sur
      # l'hôte). Sert UNIQUEMENT à accéder à Swagger UI en développement
      # (http://localhost:5080/swagger). Le vrai "point d'entrée unique" pour
      # un client applicatif reste Kong (port 8000) : c'est lui, et lui seul,
      # que consomme le front React. En production, cette ligne "ports"
      # serait supprimée pour ne garder que l'accès via Kong.
      - "5080:8080"

  # ---------------------------------------------------------------------
  # Kong API Gateway — point d'entrée unique (mode DB-less)
  # ---------------------------------------------------------------------
  kong:
    image: kong:3.7
    container_name: kong-gateway
    depends_on:
      - api
    environment:
      KONG_DATABASE: "off"                       # pas de PostgreSQL : config chargée depuis un fichier
      KONG_DECLARATIVE_CONFIG: "/kong/kong.yml"   # chemin du fichier de config dans le conteneur
      KONG_PROXY_LISTEN: "0.0.0.0:8000"           # port public : là où le client envoie ses requêtes
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"           # API d'admin Kong (exposée ici pour la démo seulement)
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro         # config déclarative, montée en lecture seule
    ports:
      - "8000:8000"   # <-- point d'entrée unique de toute l'application
      - "8001:8001"   # admin Kong (en prod : à restreindre au réseau interne)
    networks:
      - infra-network

  # ---------------------------------------------------------------------
  # Frontend React — build statique servi par Nginx
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infra-frontend
    depends_on:
      - kong
      - keycloak
    ports:
      - "5173:80"   # même port que le serveur de dev Vite, pour ne rien changer
                     # aux URLs de redirection Keycloak (redirectUris) ni aux
                     # habitudes de test.
    networks:
      - infra-network

networks:
  infra-network:
    driver: bridge

volumes:
  postgres-data:   # volume nommé : les données PostgreSQL survivent à un `docker compose down` (sans -v)
