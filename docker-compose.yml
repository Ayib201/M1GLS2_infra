services:
  # ---------------------------------------------------------------------
  # HashiCorp Vault — stockage centralisé des secrets (mode "dev")
  # ---------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: vault-dev
    cap_add:
      - IPC_LOCK   # Autorise Vault à verrouiller ses pages mémoire (empêche
                   # que les secrets en RAM soient écrits sur le disque / swap)
    environment:
      # Token "root" fixe : en mode dev il n'y a pas de vrai unseal (déverrouillage),
      # ce token sert directement à s'authentifier. A NE JAMAIS faire en production.
      VAULT_DEV_ROOT_TOKEN_ID: "dev-only-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"   # exposé sur l'hôte pour pouvoir inspecter Vault (UI/CLI) en démo
    networks:
      - infra-network

  # ---------------------------------------------------------------------
  # Vault-init — dépose le secret de démo dans Vault (dev mode = base vide
  # à chaque démarrage, il faut donc l'alimenter nous-mêmes une fois prêt)
  # ---------------------------------------------------------------------
  vault-init:
    image: hashicorp/vault:1.17
    container_name: vault-init
    depends_on:
      - vault
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dev-only-root-token"
    entrypoint: ["sh", "-c"]
    command: >
      "sleep 3 &&
       vault kv put secret/external-api CleSecreteExterne='Valeur-Secrete-Demo-2026' &&
       vault kv put secret/database ConnectionString='Host=postgres;Port=5432;Database=infra_demo;Username=infra_user;Password=infra_password_dev' &&
       echo 'Secrets déposés dans Vault (external-api + database).'"
    networks:
      - infra-network
    restart: "no"   # tâche ponctuelle : elle s'exécute une fois puis s'arrête, ce n'est pas un service

  # ---------------------------------------------------------------------
  # PostgreSQL — base de données relationnelle pour l'API C# (profils)
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: infra_user
      POSTGRES_PASSWORD: infra_password_dev   # démo uniquement — la vraie chaîne
                                               # de connexion transite par Vault,
                                               # pas par ces variables d'env côté API
      POSTGRES_DB: infra_demo
    ports:
      - "5432:5432"   # publié pour que TOI (depuis ton terminal) puisses lancer
                       # `dotnet ef database update` sans passer par Docker
    volumes:
      - postgres-data:/var/lib/postgresql/data   # persistance des données entre redémarrages
    networks:
      - infra-network

  # ---------------------------------------------------------------------
  # Keycloak — IAM : authentification SSO / OAuth2 / OIDC
  # ---------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # --- Fixe l'URL "officielle" de Keycloak (utilisée dans le champ "issuer"
      # des jetons émis), INDÉPENDAMMENT de l'URL réellement utilisée pour
      # l'atteindre. Sans ça : jeton obtenu via localhost:8080 (depuis ton poste)
      # mais validé par l'API via keycloak:8080 (réseau Docker interne) => les
      # deux "issuer" ne correspondent pas => 401 systématique. Voir étape 7.
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Réalm pré-configuré (client + utilisateur de test), importé automatiquement
      # au démarrage grâce à --import-realm : pas besoin de tout recréer à la main
      # à chaque `docker compose down`.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - infra-network

  # ---------------------------------------------------------------------
  # API ASP.NET Core — Service A + Service B (logique métier simulée)
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile   # créé à l'étape 4
    container_name: infra-api
    depends_on:
      - vault
      - vault-init   # démarre après le dépôt des secrets (ne garantit toujours pas
                     # que Vault "répond déjà" au bon moment, d'où la logique de
                     # retry côté C# dans VaultSecretService)
      - postgres
      - keycloak
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      # Convention ASP.NET Core : "__" (double underscore) = niveau imbriqué
      # dans la config, équivalent à { "Vault": { "Address": "...", "Token": "..." } }
      Vault__Address: "http://vault:8200"
      Vault__Token: "dev-only-root-token"
      # URL interne (réseau Docker) utilisée par le middleware JWT pour aller
      # chercher les clés publiques de Keycloak et valider les jetons.
      Keycloak__Authority: "http://keycloak:8080/realms/infra-demo"
    networks:
      - infra-network
    ports:
      # Republié sur un port DIFFÉRENT de Keycloak (qui occupe déjà 8080 sur
      # l'hôte). Sert UNIQUEMENT à accéder à Swagger UI en développement
      # (http://localhost:5080/swagger). Le vrai "point d'entrée unique" pour
      # un client applicatif reste Kong (port 8000) : c'est lui, et lui seul,
      # que consommera le futur front Angular. En production, cette ligne
      # "ports" serait supprimée pour ne garder que l'accès via Kong.
      - "5080:8080"

  # ---------------------------------------------------------------------
  # Kong API Gateway — point d'entrée unique (mode DB-less)
  # ---------------------------------------------------------------------
  kong:
    image: kong:3.7
    container_name: kong-gateway
    depends_on:
      - api
    environment:
      KONG_DATABASE: "off"                       # pas de PostgreSQL : config chargée depuis un fichier
      KONG_DECLARATIVE_CONFIG: "/kong/kong.yml"   # chemin du fichier de config dans le conteneur
      KONG_PROXY_LISTEN: "0.0.0.0:8000"           # port public : là où le client envoie ses requêtes
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"           # API d'admin Kong (exposée ici pour la démo seulement)
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro         # config déclarative, montée en lecture seule
    ports:
      - "8000:8000"   # <-- point d'entrée unique de toute l'application
      - "8001:8001"   # admin Kong (en prod : à restreindre au réseau interne)
    networks:
      - infra-network

networks:
  infra-network:
    driver: bridge

volumes:
  postgres-data:   # volume nommé : les données PostgreSQL survivent à un `docker compose down` (sans -v)
