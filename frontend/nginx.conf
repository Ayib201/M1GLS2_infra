# Configuration minimale pour servir une SPA (Single Page Application).
# "try_files $uri /index.html" : si l'URL demandée ne correspond à aucun
# fichier statique existant, on renvoie quand même index.html plutôt qu'une
# 404 -- nécessaire pour toute future navigation côté client (React Router
# et autres), même si cette démo n'a qu'une seule page pour l'instant.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
