_format_version: "3.0"
# Kong en mode DB-less lit ce fichier au démarrage : c'est TOUTE la config
# du gateway (routes + plugins), pas besoin de base de données.

services:

  # -----------------------------------------------------------------
  # Service A -> route publique "/service-a" + limite de débit
  # -----------------------------------------------------------------
  - name: service-a
    url: http://api:8080/api/v1/serviceA   # "api" = nom du service Docker (docker-compose.yml)
    routes:
      - name: route-service-a
        paths:
          - /service-a
        strip_path: true   # Kong retire "/service-a" avant de transmettre à l'API
                            # (le client tape /service-a, l'API reçoit l'appel sur
                            # son propre chemin /api/v1/serviceA, défini dans "url")
    plugins:
      - name: rate-limiting
        config:
          second: 5          # voir explication ci-dessous : approximation de "5 / 10s"
          policy: local      # compteur gardé en mémoire de ce nœud Kong (pas de Redis nécessaire)
          fault_tolerant: true       # si le compteur plante, on laisse passer plutôt que de tout bloquer
          hide_client_headers: false # Kong ajoute des en-têtes X-RateLimit-* dans la réponse (utile en démo)

  # -----------------------------------------------------------------
  # Service B -> route publique "/service-b", pas de limite
  # -----------------------------------------------------------------
  - name: service-b
    url: http://api:8080/api/v1/serviceB
    routes:
      - name: route-service-b
        paths:
          - /service-b
        strip_path: true
