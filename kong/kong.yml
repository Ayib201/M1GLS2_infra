_format_version: "3.0"
# Kong en mode DB-less lit ce fichier au démarrage : c'est TOUTE la config
# du gateway (routes + plugins), pas besoin de base de données.

services:

  # -----------------------------------------------------------------
  # Service A -> route publique "/service-a" + limite de débit
  # -----------------------------------------------------------------
  - name: service-a
    url: http://api:8080/api/v1/serviceA   # "api" = nom du service Docker (docker-compose.yml)
    routes:
      - name: route-service-a
        paths:
          - /service-a
        strip_path: true   # Kong retire "/service-a" avant de transmettre à l'API
                            # (le client tape /service-a, l'API reçoit l'appel sur
                            # son propre chemin /api/v1/serviceA, défini dans "url")
    plugins:
      - name: rate-limiting
        config:
          second: 5          # voir explication ci-dessous : approximation de "5 / 10s"
          policy: local      # compteur gardé en mémoire de ce nœud Kong (pas de Redis nécessaire)
          fault_tolerant: true       # si le compteur plante, on laisse passer plutôt que de tout bloquer
          hide_client_headers: false # Kong ajoute des en-têtes X-RateLimit-* dans la réponse (utile en démo)

  # -----------------------------------------------------------------
  # Service B -> route publique "/service-b", pas de limite
  # -----------------------------------------------------------------
  - name: service-b
    url: http://api:8080/api/v1/serviceB
    routes:
      - name: route-service-b
        paths:
          - /service-b
        strip_path: true

  # -----------------------------------------------------------------
  # Profils -> route publique "/api/v1/profils" (chemin IDENTIQUE côté
  # public et côté API, donc strip_path: false et pas de suffixe dans "url")
  # + même limite de débit que Service A.
  # -----------------------------------------------------------------
  - name: profils
    url: http://api:8080   # pas de chemin ici : on laisse passer le chemin tel quel
    routes:
      - name: route-profils
        paths:
          - /api/v1/profils
        strip_path: false   # "/api/v1/profils/creer" arrive intact à l'API
    plugins:
      - name: rate-limiting
        config:
          second: 5
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # -----------------------------------------------------------------
  # Keycloak -- exposé via Kong pour que le NAVIGATEUR puisse l'atteindre
  # sous "localhost:8000" (le seul nom qu'il sait déjà résoudre), sans
  # toucher au fichier hosts de la machine. Keycloak est configuré
  # (docker-compose.yml, KC_HOSTNAME=localhost / KC_HOSTNAME_PORT=8000)
  # pour se présenter sous cette même adresse dans tous les liens qu'il
  # génère (page de connexion, jetons...).
  # Pas de rate-limiting ici : la page de connexion charge plusieurs
  # fichiers statiques (CSS/JS) en une fraction de seconde, ça dépasserait
  # tout de suite une limite de 5 requêtes.
  # -----------------------------------------------------------------
  - name: keycloak-realms
    url: http://keycloak:8080
    routes:
      - name: route-keycloak-realms
        paths:
          - /realms
        strip_path: false

  - name: keycloak-resources
    url: http://keycloak:8080
    routes:
      - name: route-keycloak-resources
        paths:
          - /resources
        strip_path: false
